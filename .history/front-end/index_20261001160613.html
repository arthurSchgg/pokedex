<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Pokédex</title>
</head>

<body>

    <h1>Pokédex</h1>

    <div id="container-pokemon">Lista de Pokémons</div>

    <form id="pokemon-form">

        <h2>Cadastrar Pokémon</h2>

        <input id="nome" type="text" placeholder="Nome" required>

        <input id="tipo1" type="text" placeholder="Tipo 1" required>

        <input id="tipo2" type="text" placeholder="Tipo 2">

        <input id="hp" type="number" placeholder="Hp" required>

        <input id="ataque" type="number" placeholder="Ataque" required>

        <input id="defesa" type="number" placeholder="Defesa" required>

        <input id="velocidade" type="number" placeholder="Velocidade" required> 

        <input id="imagem_url" type="text" placeholder="URL da imagem" required>

        <button type="submit">Cadastrar Pokémon</button>
        
    </form>


    <div>
        <h2>Buscar Pokémon por Id</h2>

        <input
            type="number"
            id="id"
            placeholder="Digite o ID do pokémon que deseja buscar"
        >

        <button id="buscar-pokemon">Buscar</button>
    </div>

    <div id="pokemon-buscado"></div>

    <div>
        <h2>Atualizar Pokémon</h2>

        <form id="pokemon-update-form">
            <input
                type="number"
                id="update-id"
                placeholder="ID do Pokémon"
                required
            >

            <input
                type="number"
                id="update-nome"
                placeholder="ID do Pokémon"
                required
            >

            <input
                type="number"
                id="update-tipo1"
                placeholder="ID do Pokémon"
                required
            >

            <input
                type="number"
                id="update-tipo2"
                placeholder="ID do Pokémon"
                required
            >

            <input
                type="number"
                id="update-hp"
                placeholder="ID do Pokémon"
                required
            >

            <input
                type="number"
                id="update-ataque"
                placeholder="ID do Pokémon"
                required
            >

            <input
                type="number"
                id="update-defesa"
                placeholder="ID do Pokémon"
                required
            >

            <input
                type="number"
                id="update-velocidade"
                placeholder="ID do Pokémon"
                required
            >

            <input
                type="number"
                id="update-imagem_url"
                placeholder="ID do Pokémon"
                required
            >

            <button type="submit">Atualizar Pokémon
            </button>
        </form>
    </div>

    <script src="script.js"></script>
</body>

</html>
